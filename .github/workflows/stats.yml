name: Generate Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 🔥 ADICIONE ESTAS PERMISSÕES 🔥
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Generate stats.svg
        uses: jstriebel/stats-action@v2
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          stats_branch: stats-output
          languages_branch: languages-output
