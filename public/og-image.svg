  <circle cx="1050" cy="80" r="180" fill="#a78bfa" opacity="0.08"/>
  <circle cx="150" cy="550" r="250" fill="#7c3aed" opacity="0.08"/>
  <circle cx="150" cy="550" r="150" fill="#7c3aed" opacity="0.08"/>
  
  <!-- Header: ponto -->
  <circle cx="92" cy="70" r="8" fill="#a78bfa" opacity="0.3"/>
  <circle cx="92" cy="70" r="6" fill="#a78bfa"/>
  
  <!-- Header: texto -->
  <text x="120" y="78" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#e4e7eb">mmariacosta</text>
  <text x="280" y="78" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#4a4a58">@sec</text>
  <text x="345" y="78" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#a78bfa">:~$</text>
  
