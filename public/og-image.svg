  <!-- Descrição linha 1 -->
  <text x="80" y="415" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8b8b99">Portfólio com projetos de Blue Team, labs de SOC e análise de logs.</text>
  
  <!-- Descrição linha 2 -->
  <text x="80" y="450" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8b8b99">Construindo a ponte entre desenvolvimento e segurança defensiva.</text>
  
  <!-- Linha divisória -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Tag: Python -->
  <rect x="80" y="565" width="105" height="38" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
