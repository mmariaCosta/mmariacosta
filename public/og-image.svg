<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Glow roxo canto superior direito -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow roxo canto inferior esquerdo -->
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Padrão de grade -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#a78bfa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <!-- Máscara radial pra grade desaparecer nas bordas -->
    <radialGradient id="gridMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="70%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="630" fill="url(#gridMask)"/>
    </mask>

    <!-- Glow do dot -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="#0a0613"/>

  <!-- Grade decorativa (com máscara) -->
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridFade)"/>

  <!-- Glow superior direito -->
  <circle cx="1050" cy="80" r="400" fill="url(#glow1)"/>

  <!-- Glow inferior esquerdo -->
  <circle cx="150" cy="550" r="350" fill="url(#glow2)"/>

  <!-- Header: mmariacosta@sec:~$ -->
  <g transform="translate(80, 70)">
    <!-- Glow do dot -->
    <circle cx="12" cy="0" r="24" fill="url(#dotGlow)"/>
    <!-- Dot sólido -->
    <circle cx="12" cy="0" r="6" fill="#a78bfa"/>
    <circle cx="12" cy="0" r="3" fill="#e4e7eb"/>

    <!-- Texto do header -->
    <text x="40" y="8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="22" font-weight="600" fill="#e4e7eb" letter-spacing="1">
      mmariacosta
    </text>
    <text x="200" y="8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="22" font-weight="600" fill="#4a4a58" letter-spacing="1">
      @sec
    </text>
    <text x="265" y="8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="22" font-weight="600" fill="#a78bfa" letter-spacing="1">
      :~$
    </text>
  </g>

  <!-- Centro: Nome -->
  <text x="80" y="290" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="110" font-weight="700" fill="#e4e7eb" letter-spacing="-4">
    Maria Costa
  </text>

  <!-- Centro: Role -->
  <text x="80" y="355" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="500" fill="#a78bfa" letter-spacing="-0.5">
    Desenvolvedora ADVPL · Cibersegurança
  </text>

  <!-- Centro: Descrição -->
  <text x="80" y="415" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#8b8b99" letter-spacing="-0.3">
    Portfólio com projetos de Blue Team, labs de SOC e análise de logs.
  </text>
  <text x="80" y="450" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#8b8b99" letter-spacing="-0.3">
    Construindo a ponte entre desenvolvimento e segurança defensiva.
  </text>

  <!-- Linha divisória -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Footer: Tags -->
  <g transform="translate(80, 565)">
    <!-- Tag: Python -->
    <rect x="0" y="0" width="105" height="38" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
    <text x="52.5" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#a78bfa" letter-spacing="0.5">
      Python
    </text>

    <!-- Tag: React -->
    <rect x="117" y="0" width="95" height="38" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
    <text x="164.5" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#a78bfa" letter-spacing="0.5">
      React
    </text>

    <!-- Tag: ADVPL -->
    <rect x="224" y="0" width="100" height="38" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
    <text x="274" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#a78bfa" letter-spacing="0.5">
      ADVPL
    </text>

    <!-- Tag: Blue Team -->
    <rect x="336" y="0" width="135" height="38" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
    <text x="403.5" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#a78bfa" letter-spacing="0.5">
      Blue Team
    </text>
  </g>

  <!-- Footer: URL -->
  <text x="1120" y="588" text-anchor="end" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="18" font-weight="500" fill="#6b6b74" letter-spacing="0.5">
    mmariacosta.vercel.app
  </text>
</svg>